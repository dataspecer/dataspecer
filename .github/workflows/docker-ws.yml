name: Docker image

# Since almost all branches need to be built, we trigger on all pushes.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dataspecer/ws

jobs:
  build-and-push-image:
    name: Build and push
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Pull request events use the merge commit.
          ref: ${{ github.sha }}
          fetch-depth: 0  # Fetch the full history for git describe
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: dataspecer
          password: ${{ secrets.GHCR_DATASPECER }}
      - name: Get commit metadata
        id: commit_meta
        run: |
          COMMIT_DATE=$(git log -1 --format=%cd --date=iso-strict)
          COMMIT_NUMBER=$(git rev-list --count HEAD)
          echo "COMMIT_DATE=${COMMIT_DATE}" >> $GITHUB_ENV
          echo "COMMIT_NUMBER=${COMMIT_NUMBER}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          # No tags, just outputs section to publish digest
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # We need to add scope to properly cache per platform
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=min,scope=${{ matrix.platform }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref }}
            GIT_COMMIT_DATE=${{ env.COMMIT_DATE }}
            GIT_COMMIT_NUMBER=${{ env.COMMIT_NUMBER }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  create_manifest:
    name: Create multi-arch manifest
    needs: build-and-push-image
    outputs:
      tags_json: ${{ steps.tags.outputs.tags_json }}
      image_digest: ${{ steps.manifest.outputs.image_digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor:
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'stable') }}
            type=ref,event=branch,prefix=branch-
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Export tags as JSON
        id: tags
        run: |
          tags_json=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tags_json=$tags_json" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: dataspecer
          password: ${{ secrets.GHCR_DATASPECER }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Create manifest list and push
        id: manifest
        working-directory: /tmp/digests
        run: |
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | xargs -I {} echo "-t {}")
          docker buildx imagetools create $TAGS --metadata-file "$RUNNER_TEMP/manifest.json" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  notify-ci-specifications:
    name: Notify CI specifications
    needs: create_manifest
    if: ${{ vars.CI_SPECIFICATIONS_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.create_manifest.outputs.tags_json) }}
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch specification build
        env:
          # Requires Actions: Write on the target repository.
          GH_TOKEN: ${{ secrets.SPECIFICATIONS_DISPATCH_TOKEN }}
          CI_SPECIFICATIONS_REPOSITORY: ${{ vars.CI_SPECIFICATIONS_REPOSITORY }}
          IMAGE_TAG: ${{ matrix.tag }}
          IMAGE_DIGEST: ${{ needs.create_manifest.outputs.image_digest }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SPECIFICATIONS_DISPATCH_TOKEN is not set"
            exit 1
          fi

          jq -n \
            --arg tag "${IMAGE_TAG##*:}" \
            --arg image "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST" \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg title "$(git log -1 --format=%s)" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            '{ref: "main", inputs: {
              docker_tag: $tag,
              docker_image: $image,
              source_repository: $repository,
              source_commit: $commit,
              source_commit_title: $title,
              pr_number: $pr_number,
              pr_title: $pr_title
            }}' | gh api --method POST \
              "repos/$CI_SPECIFICATIONS_REPOSITORY/actions/workflows/build.yml/dispatches" \
              --input -

  notify-deploy-webhook:
    name: Notify deploy webhook
    continue-on-error: true
    needs: create_manifest
    if: ${{ needs.create_manifest.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.create_manifest.outputs.tags_json) }}
    steps:
      - name: Send deploy notification
        env:
          DEPLOY_WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL is not set"
            exit 1
          fi
          if [ -z "$DEPLOY_WEBHOOK_TOKEN" ]; then
            echo "DEPLOY_WEBHOOK_TOKEN is not set"
            exit 1
          fi

          IMAGE="${{ matrix.tag }}"

          curl -fsS -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"$IMAGE\"}"
