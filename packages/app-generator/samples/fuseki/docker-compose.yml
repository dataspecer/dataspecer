name: app-generator-fuseki

services:
    fuseki:
        image: stain/jena-fuseki:5.1.0
        # In-memory dataset with SPARQL Update enabled. Data is lost on restart and the data-loader
        # puts it back.
        command: /jena-fuseki/fuseki-server --update --mem /app
        ports:
            - '3030:3030'
        environment:
            - ADMIN_PASSWORD=admin
        healthcheck:
            test: 'curl -sf -o /dev/null "http://localhost:3030/app/query?query=ASK%7B%7D"'
            interval: 3s
            timeout: 5s
            retries: 20

    data-loader:
        image: curlimages/curl:8.11.1
        depends_on:
            fuseki:
                condition: service_healthy
        environment:
            - ADMIN_PASSWORD=admin
            - FUSEKI_URL=http://fuseki:3030
        volumes:
            - ../rdf:/rdf:ro
            - ./init-data.sh:/init-data.sh:ro
        entrypoint: ['sh', '/init-data.sh']
        restart: 'no'
